name: probe
on: { push: { branches: [probe] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy pandas scipy huggingface_hub "git+https://github.com/mistralai/timestral"
      - run: python scripts/forecast.py
      - run: |
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add data/forecasts.json && git commit -qm "forecast out" && git push -q
