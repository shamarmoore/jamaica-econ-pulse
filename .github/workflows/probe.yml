name: probe
on: { push: { branches: [probe] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node probe.mjs
      - run: |
          git config user.name bot; git config user.email actions@users.noreply.github.com
          git add data/research.json && git commit -qm "research out" && git push -q
