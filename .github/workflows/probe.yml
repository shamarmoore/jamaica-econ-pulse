name: probe
on: { push: { branches: [probe] } }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q numpy huggingface_hub
      - run: python probe.py
