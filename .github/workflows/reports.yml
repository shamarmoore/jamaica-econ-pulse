name: Read financial reports (AI)

on:
  workflow_dispatch:
    inputs:
      max: { description: 'Max reports to read this run', default: '40' }
      indexpages: { description: 'Max index pages to fetch (100 announcements each)', default: '6' }

concurrency: { group: reports, cancel-in-progress: false }

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Read reports
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/read_reports.py "${{ github.event.inputs.max }}" "${{ github.event.inputs.indexpages }}"
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports_index.json data/financials.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "data: financial report readings $(date -u +%F) [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
