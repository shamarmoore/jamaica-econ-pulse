name: Read financial reports (AI)

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'reports: read financial statements · notices: summarise key announcements · ai_backtest: blind test of the recovery AI · shareholders: read the top-ten shareholder lists'
        type: choice
        options: [reports, notices, ai_backtest, shareholders]
        default: reports
      max: { description: 'Max reports / notices / AI test cases / shareholder lists this run', default: '40' }
      indexpages: { description: 'Max index pages to fetch (100 announcements each)', default: '6' }
      syms: { description: 'notices only: comma-separated symbols to read instead of the watch lists', default: '' }
      retry: { description: 'shareholders only: read again the scanned reports where no list was found', type: boolean, default: false }

concurrency: { group: reports, cancel-in-progress: false }

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: PDF tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Read reports (saving after every batch)
        if: github.event.inputs.job == 'reports' || github.event.inputs.job == ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          left=${{ github.event.inputs.max }}
          while [ "$left" -gt 0 ]; do
            n=$(( left < 150 ? left : 150 ))
            python scripts/read_reports.py "$n" "${{ github.event.inputs.indexpages }}" || true
            git add data/reports_index.json data/financials.json 2>/dev/null || true
            git diff --cached --quiet || git commit -q -m "data: financial report readings $(date -u +%F) [skip ci]"
            for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
            [ "$(cat /tmp/reports_more 2>/dev/null)" = "yes" ] || break
            left=$(( left - n ))
          done
      - name: Summarise key announcements
        if: github.event.inputs.job == 'notices'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q numpy pandas
          python scripts/read_notices.py "${{ github.event.inputs.max }}" ${{ github.event.inputs.syms && format('--syms={0}', github.event.inputs.syms) || '' }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/notices.json && { git diff --cached --quiet || git commit -q -m "data: announcement summaries $(date -u +%F) [skip ci]"; }
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
      - name: Blind test of the recovery AI
        if: github.event.inputs.job == 'ai_backtest'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q numpy pandas scipy
          python scripts/ai_backtest.py "${{ github.event.inputs.max }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_backtest.json && { git diff --cached --quiet || git commit -q -m "data: recovery AI blind test $(date -u +%F) [skip ci]"; }
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
      - name: Read the top-ten shareholder lists (saving after every batch)
        if: github.event.inputs.job == 'shareholders'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MORE_FLAG: /tmp/shareholders_more
        run: |
          pip install -q pypdf cryptography
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          left=${{ github.event.inputs.max }}
          while [ "$left" -gt 0 ]; do
            n=$(( left < 200 ? left : 200 ))
            python scripts/shareholders.py "$n" ${{ github.event.inputs.retry == 'true' && '--retry' || '' }} || true
            git add data/shareholders.json 2>/dev/null || true
            git diff --cached --quiet || git commit -q -m "data: top-ten shareholder lists $(date -u +%F) [skip ci]"
            for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
            [ "$(cat /tmp/shareholders_more 2>/dev/null)" = "yes" ] || break
            left=$(( left - n ))
          done
