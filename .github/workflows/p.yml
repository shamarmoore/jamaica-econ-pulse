name: probe-fund
on: { push: { branches: [probe-fund] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q numpy pandas scipy huggingface_hub "git+https://github.com/mistralai/timestral"
      - run: timeout 1500 python -u scripts/backtest_ts.py 42 120
