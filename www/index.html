<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3EEE3">
  <title>Jamaica Economic Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="mast">
    <div class="mast-top">
      <div>
        <div class="kicker" id="today"></div>
        <h1>Jamaica <em>Economic</em> Pulse</h1>
      </div>
      <button id="refresh" class="refresh" aria-label="Refresh all data">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="status" id="status">Loading…</div>
  </header>

  <main id="view"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="pulse" class="on"><span class="ti">◉</span>Pulse</button>
    <button data-tab="jamaica"><span class="ti">▲</span>Jamaica</button>
    <button data-tab="world"><span class="ti">◍</span>World</button>
    <button data-tab="borrow"><span class="ti">%</span>Borrow</button>
    <button data-tab="news"><span class="ti">≡</span>News</button>
    <button data-tab="sources"><span class="ti">⌘</span>Sources</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
